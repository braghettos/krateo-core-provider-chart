apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: krateo-core-provider-agent
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/name: krateo-core-provider-agent
    app.kubernetes.io/part-of: krateo-core-provider
spec:
  type: Declarative
  description: >-
    The Krateo composition-engine expert: authors and manages CompositionDefinitions (core.krateo.io/v1alpha1)
    and their blueprint Helm charts (templates + values.yaml + values.schema.json), inspects the generated
    typed CRDs and Composition instances (composition.krateo.io), wires remote deploys via KubernetesTarget,
    and browses the blueprint marketplace, grounded in braghettos/krateo-core-provider and
    braghettos/krateo-core-provider-chart.
  declarative:
    deployment:
      env:
{{- include "core-provider-agent.genaiEnv" . | nindent 8 }}
    modelConfig: {{ .Values.modelConfig.name }}
    stream: true
    promptTemplate:
      dataSources:
        - kind: ConfigMap
          name: core-provider-agent-prompts-{{ .Values.prompts.language }}
          alias: prompts
    systemMessage: |
      {{`{{include "prompts/core_provider_agent"}}`}}
    tools:
      - type: McpServer
        mcpServer:
          name: kagent-tool-server
          kind: RemoteMCPServer
          apiGroup: kagent.dev
{{- if .Values.hitlApproval }}
          # HITL: mutating tools pause for human approval (kagent requireApproval)
          requireApproval:
            - k8s_apply_manifest
{{- end }}
          toolNames:
            - k8s_get_resources
            - k8s_get_resource_yaml
            - k8s_apply_manifest
{{- if .Values.fetch.enabled }}
      # Tokenless doc grounding: GET the version-pinned raw docs/llms.txt URL (public, no auth/token).
      - type: McpServer
        mcpServer:
          name: {{ .Values.fetch.mcpServer }}
          kind: MCPServer
          apiGroup: kagent.dev
          toolNames:
            - fetch
{{- end }}
{{- if .Values.github.enabled }}
      - type: McpServer
        mcpServer:
          name: {{ .Values.github.mcpServer }}
          kind: RemoteMCPServer
          apiGroup: kagent.dev
          toolNames:
            - get_file_contents
            - search_repositories
            - create_or_update_file
            - push_files
{{- end }}
    a2aConfig:
      skills:
        - id: author-blueprints
          name: Author blueprints and CompositionDefinitions
          description: >-
            Generate a parameterized blueprint chart (templates, values.yaml, values.schema.json) plus its
            CompositionDefinition so core-provider derives a correctly-typed CRD.
          tags: [krateo, blueprint, compositiondefinition, helm-chart, core-provider]
          examples:
            - Create a CompositionDefinition for my nginx Helm chart at oci://ghcr.io/acme/nginx-chart.
            - Write a values.schema.json so the generated CRD is fully typed for my blueprint.
            - How does core-provider derive the Kind and apiVersion from my Chart.yaml name and version?
            - Set up my CompositionDefinition to deploy to a remote cluster with a KubernetesTarget.
        - id: inspect-compositions
          name: Inspect compositions and marketplace
          description: >-
            List installed CompositionDefinitions and Composition instances, read the generated CRDs, and
            browse the marketplace for available blueprints.
          tags: [krateo, composition, marketplace, crd, inspect]
          examples:
            - List the CompositionDefinitions installed in my cluster and show their generated CRDs.
            - Show me the available blueprints in the marketplace I can install.
            - What does the spec of my fireworks-app Composition override in the blueprint chart?
    deployment:
      resources:
{{- toYaml .Values.resources | nindent 8 }}
