# Namespace for this agent's Agent/ModelConfig/prompts CRs. "" ⇒ the release namespace (where the
# agent composition is deployed); set explicitly to override.
namespace: ""
# ModelConfig for this agent. By default it REFERENCES a ModelConfig by name (e.g. one the
# autopilot ships: gemini-flash / gemini-pro). Set create=true to provision a DEDICATED ModelConfig
# for THIS agent, so it can use a different model/provider independently of the other agents.
modelConfig:
  # gemini-pro (not flash): this is an AUTHORING specialist — it composes CompositionDefinitions +
  # compositions, the same authoring role that runs helm-agent + frontend-agent on pro. Authoring
  # valid CRs + reading apiserver validation errors needs the stronger model.
  name: gemini-pro
  create: false
  provider: GeminiVertexAI          # GeminiVertexAI (ADC) | Gemini (API key) | Anthropic | OpenAI
  model: gemini-2.5-flash
  vertexAI:                         # used when provider == GeminiVertexAI
    projectID: ""
    location: us-central1
  apiKeySecret: ""                  # used when the provider needs a key (Gemini/Anthropic/OpenAI)
  apiKeySecretKey: ""
prompts:
  language: eng

# Human-in-the-loop gate on the mutating k8s tools (k8s_apply_manifest) the agent
# uses to apply CompositionDefinitions/Compositions. true = pause for approval (safe); false = autonomous.
hitlApproval: true
vertexAI:
  enabled: true
  projectID: ""
  location: us-central1
# Repo-search MCP (RemoteMCPServer krateo-repo-mcp-server)
repoSearch:
  enabled: true
  mcpServer: krateo-repo-mcp-server

# Tokenless fetch MCP (kagent MCPServer, fetch-mcp-server)
fetch:
  enabled: true
  mcpServer: fetch-mcp-server

# github MCP server for DEEPER source reading (search_repositories, get_file_contents, etc.) —
# OPT-IN, off by default: it requires the github-mcp-server running with a PAT. Doc grounding uses
# the tokenless fetch tool above.
github:
  enabled: false
  mcpServer: github-mcp-server
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi
